{% extends 'base.html' %}
{% block title %}Usuários | Controle de Estoque{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3>Usuários</h3>
  <a class="btn btn-primary" href="{{ url_for('usuario_novo') }}">Novo usuário</a>
</div>
<div class="card">
  <table class="table mb-0">
    <thead><tr><th>Nome</th><th>Login</th><th>Perfil</th></tr></thead>
    <tbody>
    {% for u in usuarios %}
      <tr><td>{{ u.nome }}</td><td>{{ u.login }}</td><td>{{ 'Administrador' if u.perfil == 'admin' else 'Comum' }}</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
